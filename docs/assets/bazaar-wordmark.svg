<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-labelledby="bwm-title">
  <title id="bwm-title">Bazaar — Swiss Signal wordmark</title>
  <!-- SWISS SIGNAL lockup: expanded-black uppercase ink type, one signal-red
       full stop, hairline baseline rule. Matches frontend tokens
       (#111111 ink · #C42B1C signal red · #F5F5F3 paper). -->
  <g font-family="Archivo, 'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="800" letter-spacing="-3">
    <text x="16" y="118" font-size="128" fill="#111111">BAZAAR<tspan fill="#C42B1C">.</tspan></text>
  </g>
  <rect x="20" y="140" width="150" height="5" fill="#C42B1C"/>
</svg>

# CI — static checks + backend tests against an ephemeral MongoDB replica set.
#
# Design notes:
# - The `test` job uses an ephemeral mongo:7 service container started as a
#   single-node replica set (--replSet rs0). Transactions require an INITIATED
#   replica set, so an explicit init step runs BEFORE anything touches the DB.
# - Env contract mirrors backend/src/config.ts: MONGODB_URI is the only required
#   var; MONGODB_DB_NAME is pinned to a throwaway database so CI never touches
#   anything else. All FIREBASE_* vars default to "" and are NOT required:
#   Firebase Admin initializes lazily and degrades to null auth, which every
#   test/route handles.
#
# - RUNTIME: every job resolves Node from `.nvmrc` (20). Netlify reads the same
#   file, and netlify.toml pins NODE_VERSION=20 explicitly on top of it, so CI,
#   the Actions deploy fallback and Netlify's own builders all run ONE version.
#   Before INFRA-04 the workflows hardcoded "24" while netlify.toml pinned "20"
#   — the exact split that let a green CI ship a build Netlify could not produce
#   (Node 24 does not install rolldown's linux binding).
#
# ALTERNATIVE (Atlas-secrets path): delete the `services:` block + init step
# below, set a repository secret MONGODB_URI pointing at the Atlas cluster
# (e.g. mongodb+srv://user:pass@host/bazaar_test?retryWrites=true), and expose it
# via job-level `env: MONGODB_URI: ${{ secrets.MONGODB_URI }}`. Keep the same
# TASK-05 retry-once test steps unchanged — they mitigate the documented
# MongoNetworkError / hook-timeout infra flake class regardless of backend.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks & frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # npm bug 4828: a Windows-generated lockfile omits the Linux rolldown
      # binding, so `vite build` fails on ubuntu. Named install bypasses it.
      - name: Install linux rolldown binding
        run: npm install @rolldown/binding-linux-x64-gnu@1.2.1 --no-save --force

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-client-dist
          path: frontend/dist/client
          if-no-files-found: error
          retention-days: 7

  test:
    name: Backend tests (ephemeral MongoDB)
    runs-on: ubuntu-latest
    env:
      # Mirrors backend/src/config.ts: MONGODB_URI is the only required var;
      # MONGODB_DB_NAME defaults to "bazaar" but is pinned here so CI never
      # touches anything outside this throwaway database.
      MONGODB_URI: mongodb://127.0.0.1:27017/bazaar_test?replicaSet=rs0&directConnection=true
      MONGODB_DB_NAME: bazaar_test
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --bind_ip_all
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Transactions require an INITIATED replica set: mongod runs with
      # --replSet rs0 but stays NOT_INITIALIZED until rs.initiate() succeeds.
      # Idempotent: re-initiating an initialized set just errors harmlessly;
      # the loop exits only once rs.status() reports a healthy PRIMARY.
      - name: Init single-node replica set (rs0)
        run: |
          MONGO_ID="${{ job.services.mongo.id }}"
          ready=0
          for attempt in $(seq 1 30); do
            docker exec "$MONGO_ID" mongosh --quiet --eval 'try { rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]}) } catch (e) { print(e.message) }' >/dev/null 2>&1 || true
            if docker exec "$MONGO_ID" mongosh --quiet --eval 'try { if (rs.status().ok === 1) { quit(0) } } catch (e) {} quit(1)'; then
              echo "::notice::replica set rs0 reached PRIMARY"
              ready=1
              break
            fi
            echo "waiting for PRIMARY (attempt ${attempt}/30)"
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::replica set rs0 failed to reach PRIMARY"
            exit 1
          fi

      # Inspection finding: most test files seed their own fixtures, but
      # backend/tests/catalog.test.ts ("search suggestions", prefix "nov") requires the
      # seeded catalogue products, so a fresh database MUST be bootstrapped and seeded first.
      # Both scripts are idempotent and close their DB connections on completion.
      - name: Bootstrap ephemeral database
        run: npm run db:bootstrap

      - name: Seed ephemeral database
        run: npm run db:seed

      # TASK-05 mitigation: the suite intermittently hits MongoNetworkError /
      # hook-timeout infra flakes with ZERO assertion failures; an immediate
      # retry passes. Retry exactly once — the job fails only if BOTH attempts fail.
      - name: Run backend tests
        run: npm test

      - name: Run backend tests (retry once — TASK-05 infra-flake mitigation)
        if: failure()
        run: npm test

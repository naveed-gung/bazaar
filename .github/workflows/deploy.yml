# Deploy (Netlify) — Actions-driven CLI deploy fallback.
#
# NOTE: the preferred long-term deployment path is Netlify's Git integration
# (connect the repo in the Netlify UI). That is a HUMAN-GATE step handled
# elsewhere; this workflow exists so production deploys still work from CI
# until/unless that switch is made.
#
# Behavior: when NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID repo secrets are absent,
# the guard emits a notice annotation and the job SUCCEEDS gracefully (every
# real step is gated on the guard output) instead of failing the push.

name: Deploy (Netlify)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy frontend to Netlify production
    runs-on: ubuntu-latest
    steps:
      - name: "Guard: require Netlify secrets"
        id: guard
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets are not set — skipping Netlify deploy. Add repository secrets to enable auto-deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: npm ci

      - name: Deploy to Netlify production
        if: steps.guard.outputs.enabled == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli@latest deploy --build --prod --filter @bazaar/frontend

[build]
  # npm bug 4828: a lockfile generated on Windows omits the Linux rolldown
  # binding, and neither named installs nor --force reliably bypass it inside
  # npm workspaces. Dropping the lockfile on the build box lets Linux resolve
  # its own platform binding; local dev and the committed lockfile are
  # unaffected. Versions stay pinned by the ranges in package.json.
  command = "node -e \"require('fs').rmSync('package-lock.json',{force:true})\" && npm install && npm run build --workspace frontend"
  publish = "frontend/dist/client"
  functions = "netlify/functions"

# Node 24 broke production builds: npm's optional-dependency resolution does
# not install rolldown's platform binding (@rolldown/binding-linux-x64-gnu)
# there, so `vite build` failed and deploys stopped shipping — which is also
# why earlier hydration hotfixes appeared to "not work" on production. Pin the
# LTS line the toolchain supports.
#
# INFRA-04: `.nvmrc` now carries the same "20" and is what GitHub Actions reads
# (node-version-file), so CI, the Actions deploy fallback and Netlify's builders
# agree. Netlify reads .nvmrc too; NODE_VERSION is kept because an explicit
# netlify.toml value wins over the file and makes the pin visible where the
# build is configured. CHANGE BOTH TOGETHER or the split-brain comes back.
[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express"]
  included_files = ["backend/src/**", "packages/shared/src/**"]

[[redirects]]
  from = "/p/*"
  to = "/product/:splat"
  status = 301
  force = false

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # INFRA-05: the site is HTTPS-only on Netlify, so pin it. No `preload` — that
    # is a one-way submission to the browser preload list and an owner decision.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Clickjacking: nothing here is meant to be framed. Deliberately NOT setting
    # Cross-Origin-Opener-Policy — `same-origin` breaks Firebase
    # signInWithPopup's handle back to the opener.
    X-Frame-Options = "DENY"

# Vite emits content-hashed filenames under /assets, so these are the only
# responses that can honestly claim `immutable`. Without this rule Netlify's
# default (`max-age=0, must-revalidate` + ETag) forces a conditional request for
# every chunk on every navigation.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# INFRA-05: product imagery lives at STABLE, UNHASHED paths (/catalog/foo.jpg),
# so `immutable` was a trap — replacing an image could never propagate to anyone
# who had already loaded the old one, for a year. Cache hard but revalidatable.
[[headers]]
  for = "/catalog/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

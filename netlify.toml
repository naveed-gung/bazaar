[build]
  command = "npm run build --workspace frontend"
  publish = "frontend/dist/client"
  functions = "netlify/functions"

# Node 24 broke production builds: npm's optional-dependency resolution does
# not install rolldown's platform binding (@rolldown/binding-linux-x64-gnu)
# there, so `vite build` failed and deploys stopped shipping — which is also
# why earlier hydration hotfixes appeared to "not work" on production. Pin the
# LTS line the toolchain supports.
[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express"]
  included_files = ["backend/src/**", "packages/shared/src/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/catalog/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
